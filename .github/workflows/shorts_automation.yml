name: Shorts Auto Cleaner, Unique Maker & Target Repo Pusher

on:
  push:
    paths:
      - 'videos/**/*.mp4'
      - 'videos/**/*.MP4'
      - 'videos/**/*.mov'
      - 'videos/**/*.MOV'
      - 'videos/**/*.mkv'
      - 'videos/**/*.webm'
      - 'videos/**/*.avi'
      - 'videos/**/*.m4v'
  schedule:
    - cron: '0 0 * * *'   # Daily run for 30-day auto-delete check
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Source Repository (Full History for 30-Day Check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Shorts Automation Pipeline
        env:
          PYTHONWARNINGS: "ignore::UserWarning"
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python -u process_shorts.py

      - name: Commit Source Repo State (Cleanup & CSV)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output_links.csv videos/ done_originals/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: Processed shorts, updated links & 30-day cleanup"
          git push
