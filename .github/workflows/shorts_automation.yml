name: Shorts Auto Cleaner & 12-Server Uploader

on:
  push:
    paths:
      - 'videos/**/*.mp4'
      - 'videos/**/*.MP4'
      - 'videos/**/*.mov'
      - 'videos/**/*.MOV'
      - 'videos/**/*.mkv'
      - 'videos/**/*.webm'
      - 'videos/**/*.avi'
      - 'videos/**/*.m4v'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Shorts Automation Pipeline
        run: python process_shorts.py

      - name: Commit output_links.csv & Move Done Videos
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output_links.csv videos/ done_originals/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: Processed shorts & updated direct links"
          git push

      - name: Upload Processed Videos as GitHub Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: processed-shorts
          path: processed_videos/*.mp4
          retention-days: 3
